name: Compilation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Tests et app à installer (.ipa)
    # Mac Intel de GitHub (macOS 26, même Xcode) : les Mac Apple Silicon sont saturés.
    # Gratuit pour un dépôt public.
    runs-on: macos-26-intel
    timeout-minutes: 60
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Choisir la dernière version stable de Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tests des modules
        run: |
          set -euo pipefail
          for package in SleepDomain SleepAnalysis Persistence AppSettings NightRecording; do
            echo "::group::Tests de $package"
            swift test --package-path "Packages/$package"
            echo "::endgroup::"
          done

      - name: Installer XcodeGen
        run: brew install xcodegen

      - name: Générer le projet Xcode
        run: xcodegen generate

      - name: Compiler sans signature
        run: |
          set -o pipefail
          xcodebuild \
            -project Nocturne.xcodeproj \
            -scheme Nocturne \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            -quiet \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Préparer le fichier .ipa
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/Nocturne.app"
          test -d "$APP"
          # Signature provisoire, sans certificat : elle transporte les droits (Santé) jusqu'à Sideloadly,
          # qui re-signe ensuite l'app avec ton identifiant Apple.
          codesign --force --sign - --timestamp=none "$APP/PlugIns/NocturneWidgets.appex"
          codesign --force --sign - --timestamp=none --entitlements App/Nocturne.entitlements "$APP"
          rm -rf Payload Nocturne.ipa
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry Nocturne.ipa Payload
          ls -lh Nocturne.ipa

      - name: Garder le fichier .ipa dans la compilation
        uses: actions/upload-artifact@v4
        with:
          name: Nocturne-ipa
          path: Nocturne.ipa
          retention-days: 30

      - name: Publier la version de développement
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete phase0 --cleanup-tag --yes || true
          gh release delete developpement --cleanup-tag --yes || true
          gh release create developpement Nocturne.ipa \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Version de développement · compilation ${{ github.run_number }}" \
            --notes "Version en cours de développement, pas encore essayée sur l'iPhone. Guide : Docs/INSTALLATION-WINDOWS.md"
          {
            echo "### Version de développement prête"
            echo ""
            echo "Télécharger : https://github.com/${{ github.repository }}/releases/download/developpement/Nocturne.ipa"
          } >> "$GITHUB_STEP_SUMMARY"
